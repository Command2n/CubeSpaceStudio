<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeSpace Studio's Website</title>
    <style>
        @font-face {
            font-family: "SiyuanSong Heavy";
            src: url("fonts/SiyuanSong-Heavy.otf") format("opentype"),
                 url("https://command2n.github.io/CubeSpaceStudio/fonts/SiyuanSong-Heavy.otf") format("opentype");
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #343434 0%, #000000 50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .main-title {
            font-family: "SiyuanSong Heavy";
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            color: #FFFFFF;
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .sub-title {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            color: #FFFFFF;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="main-title"><b>CubeSpace Studio</b></h1>
    <h2 class="sub-title">立方空间工作室</h2>
    <br><br><p>网页正在施工中......<p>
</body>
</html>
